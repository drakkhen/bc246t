[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bc246t"
version = "0.2.0"
description = "Remote control and programming for the Uniden Bearcat BC246T scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "jsonschema>=4.18",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Ham Radio",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
bc246t = "bc246t.cli:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
